# --- species registry (case study) -----------------------------------------
# local_names: vernacular names shown in the dashboard when the user
# switches language. Curated community knowledge (Kerala-first for the
# case study); a missing language falls back to the English common name
# - names are never machine-translated. Extend per region with local
# experts, alongside the consent-gated local-knowledge corpus.
species:
  - scientific_name: Sardinella longiceps
    common_name: Indian oil sardine
    worms_aphia_id: 212269
    modelling_path: blended           # LSTM tendency + habitat blend
    data_availability: 0.75           # lambda in C = lambda*Chat + (1-lambda)*Hhat
    preferred_sst_c: [22.0, 28.0]     # thermal envelope for habitat hints
    local_names: {ml: "ചാള", ta: "சாளை"}
    closures:
      - {months: [6, 7], reason: "spawning protection - monsoon fishing closure",
         citation: "regulations:monsoon-closure-sardine"}
  - scientific_name: Rastrelliger kanagurta
    common_name: Indian mackerel
    worms_aphia_id: 127020
    modelling_path: blended
    data_availability: 0.70
    preferred_sst_c: [24.0, 29.0]
    local_names: {ml: "അയൽ", ta: "அயிலை", hi: "बंगड़ा"}
    closures: []
  - scientific_name: Thunnus tonggol
    common_name: longtail tuna
    worms_aphia_id: 219722
    modelling_path: habitat_led
    data_availability: 0.45
    preferred_sst_c: [20.0, 28.0]     # thermal envelope for habitat hints
