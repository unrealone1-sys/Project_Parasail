[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parasail"
version = "1.0.0"
description = "Predictive Advisory and Retrieval-Augmented System Advancing Informed Livelihoods - a decision support system for sustainable fishing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anantha Krishnan AS" }]

[tool.setuptools.packages.find]
where = ["src"]
