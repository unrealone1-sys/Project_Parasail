# --- advisory scoring (weights owned by governance, not developers) --------
advisory:
  weights: {catch: 0.45, weather: 0.25, ecological: 0.30}
  thresholds:
    proceed: 0.75
    caution: 0.60
    delay: 0.40
  weather_safety:                      # small-vessel guidance used for W
    max_wind_ms: 8.0                   # ~Beaufort 5
    max_wave_height_m: 1.5
  bycatch_proxy:
    sensitive_habitat_weight: 0.5      # B rises near seagrass/coral/mangrove
    juvenile_period_weight: 0.5        # B rises in juvenile recruitment months

# --- suggested-fish scoring ------------------------------------------------
# The suggestion layer scores each grid cell with either the thermal envelope
# (untrained, always available) or a trained habitat model artifact built by
# scripts/train_habitat.py (models/habitat_<species>.joblib). An artifact is
# only written where the model beat the envelope under spatial-block
# validation AND transferred to a held-out survey; data/habitat_metrics.json
# holds the measured numbers and the adoption decision per species.
suggestions:
  method: auto              # auto | envelope | model  (model pins the trained
                            # path; auto keeps the envelope when no artifact)
  min_training_records: 50  # never serve a model trained on a thinner sample

# --- selected models -------------------------------------------------------
models:
  detector: yolov8n.pt                 # Ultralytics YOLOv8n
  classifier: google/vit-base-patch16-224
  classifier_adapter: null             # path to trained LoRA adapter (train/train_lora.py)
  lora: {r: 8, alpha: 16, dropout: 0.05, target_modules: [query, value]}
  forecaster: {layers: 2, hidden: 128, horizon_steps: 24, ckpt: null}
  habitat: {n_estimators: 400, max_depth: 12, seed: 42, ckpt: null}
  text_encoder: sentence-transformers/all-MiniLM-L6-v2
  clip: {model: ViT-B-32, pretrained: laion2b_s34b_b79k}
  # The advisory-explanation model moved to the assistant section (phase P7):
  # a single open-source vision-language model serves summaries, Q&A and
  # image understanding on the website. See docs/PRODUCTION_HARDWARE.md.

# --- grounded AI assistant (phase P7, website layer) ------------------------
# One open-source VLM (Apache-2.0) serves three jobs: plain-language advisory
# summaries (decision-making analysis), grounded Q&A over the retrieval
# corpus, and image understanding (catch photos, satellite tiles, charts).
#
# MODEL REGISTRY: users can switch models at runtime from the dashboard
# (scaling by preference / hardware). active_model is the registry key;
# the runtime selection persists in .cache/assistant_model.json, so
# config.yaml stays pristine. Add or remove entries here without code edits.
assistant:
  enabled: true
  active_model: qwen2.5vl-7b-awq
  models:
    qwen2.5vl-3b-laptop:
      backend: ollama
      model: qwen2.5vl:3b
      vram_gb: 6
      download_gb: 2.5
      description: "Laptop tier (RTX 4050 class, 6 GB) - lightest, fastest"
    qwen2.5vl-7b-awq:
      backend: vllm
      model: Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      vram_gb: 12
      download_gb: 6.9
      description: "Reference tier (8-12 GB VRAM) - best quality"
    qwen2.5vl-7b-ollama:
      backend: ollama
      model: qwen2.5vl:7b
      vram_gb: 10
      download_gb: 6.0
      description: "7B via Ollama - simplest local setup"
    qwen2.5vl-72b-awq:
      backend: vllm
      model: Qwen/Qwen2.5-VL-72B-Instruct-AWQ
      vram_gb: 48
      download_gb: 41.0
      description: "Datacenter tier - multi-GPU regional deployments"
  # backend defaults (used by the active model's backend)
  vllm:
    base_url: http://localhost:8001/v1     # vLLM OpenAI-compatible server
    model: Qwen/Qwen2.5-VL-7B-Instruct-AWQ
    api_key: EMPTY                         # vLLM ignores the value, header required
    timeout_s: 30
  ollama:                                  # local fallback backend
    base_url: http://localhost:11434
    model: qwen2.5vl:7b                    # pulls the Q4 quantisation (~5-6 GB)
    timeout_s: 60
  max_concurrent_requests: 8               # protects small GPUs from overload
  max_output_tokens: 512
  temperature: 0.2                         # low: grounded, factual answers
  summary_cache_ttl_s: 900                 # near-identical advisories share one generation
  max_image_bytes: 6291456                 # 6 MB upload cap
  grounding:
    require_citations: true                # answers must cite retrieved passages
    max_context_passages: 6                # top-k passages in the prompt

# --- retrieval-augmented explanation --------------------------------------
rag:
  qdrant_url: http://localhost:6333
  text_collection: parasail_text       # 384-d (MiniLM)
  satellite_collection: parasail_sat   # 512-d (OpenCLIP ViT-B-32)
  top_k: 4
  chunk_chars: 700
  chunk_overlap: 120

# --- ingestion sources and freshness contracts -----------------------------
ingestion:
  open_meteo:
    base: https://api.open-meteo.com/v1
    marine_base: https://marine-api.open-meteo.com/v1
    freshness_hours: 6
    cache_dir: .cache/open-meteo
  copernicus:
    freshness_hours: 30
    cache_dir: .cache/copernicus
  erddap:
    base: https://coastwatch.noaa.gov/erddap
    freshness_hours: 30
    cache_dir: .cache/erddap
  offline_policy: serve_cached_with_age_flag   # never fail silently

# --- persistence -----------------------------------------------------------
database:
  url: postgresql+psycopg://parasail:parasail@localhost:5432/parasail

# --- optional instrumented station health (dashboard telemetry panel) ------
# For deployments on an autonomous buoy or solar shore node, point status_url
# at the node's health endpoint returning JSON such as
#   {"battery_voltage_v": 12.4, "solar_output_w": 38.1}
# position places the station on the dashboard map so users can see where
# the data comes from. Unset -> the dashboard honestly reports the service
# node on external power (battery/solar values are never fabricated).
station:
  name: parasail-node
  status_url: null                     # e.g. http://192.168.1.50/status
  position: {lat: 9.965, lon: 76.242}  # shown on the map as the data source

# --- security (production hardening) ----------------------------------------
# Rate limits are per client (X-Forwarded-For first hop behind a proxy),
# sliding window. Buckets: default (reads), advisory (live-fetch endpoints),
# assistant (AI generation), image (vision uploads), translate, subscribe,
# admin. API keys grant roles: public < officer < admin. Store SHA-256
# hashes (scripts/generate_api_key.py prints them); a plaintext `key` field
# is allowed for local development only.
security:
  rate_limits:
    default:    {limit: 120, window_s: 60}
    advisory:   {limit: 30,  window_s: 60}
    assistant:  {limit: 20,  window_s: 60}
    image:      {limit: 10,  window_s: 60}
    translate:  {limit: 60,  window_s: 60}
    subscribe:  {limit: 5,   window_s: 300}
    admin:      {limit: 10,  window_s: 60}
  max_body_bytes: 10485760            # 10 MB request cap (images: 6 MB app-level)
  cors_origins:                       # no wildcards; add your public origin
    - http://localhost:8000
    - http://127.0.0.1:8000
  api_keys:                          # key stored as SHA-256 hash (scripts/generate_api_key.py)
    - {name: local-admin, key_hash: 7c757692e630973c885f85a393fe142ad7de6066908f38a9d9fab8fe1b8a985a, role: admin}
                                       # e.g. {name: ops, key_hash: <sha256>, role: admin}
  public_docs: true                   # set false in production to hide /docs

api:
  title: ParaSail Advisory API
  version: 1.0.0
  contact: "Anantha Krishnan AS - Naipunnya School of Management, Cherthala, India"
